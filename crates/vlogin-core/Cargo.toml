[package]
name = "vlogin-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Harness-independent multi-channel login for video sites"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Blocking client with rustls: no openssl, and `redirect(Policy::none())` so
# providers can harvest cookies that live on a redirect hop.
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
] }

# Only used by the bilibili password method (RSA-PKCS#1 v1.5 over salt+password).
rsa = { version = "0.9", features = ["pem"] }

# Only used by the iQiyi QR image request's `salt` parameter.
md5 = "0.7"

# DevTools Protocol client for the `browser` cookie-extraction method. Loopback
# only, so no TLS feature is needed.
tungstenite = { version = "0.26", default-features = false, features = [
    "handshake",
] }
